name: Documentation
on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', 'Directory.*', 'global.json', '.config/**', '.github/workflows/docs.yml']
  pull_request:
    branches: [main]
    paths: ['docs/**', 'src/**', 'Directory.*', 'global.json', '.config/**', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/YandexTracker/YandexTracker.csproj
      - run: dotnet build src/YandexTracker/YandexTracker.csproj -c Release --no-restore
      - run: dotnet tool restore
      - run: dotnet docfx docs/docfx.json --warningsAsErrors
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/_site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
