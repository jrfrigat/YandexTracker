name: Documentation
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: Wait for CI
    permissions:
      actions: read
      checks: read
      contents: read
    uses: ./.github/workflows/wait-for-ci.yml
    with:
      branch: main
  build:
    needs: ci
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: dotnet restore src/YandexTracker/YandexTracker.csproj
      - run: dotnet build src/YandexTracker/YandexTracker.csproj -c Release --no-restore
      - run: dotnet tool restore
      - run: dotnet docfx docs/docfx.json --warningsAsErrors
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
