name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - run: dotnet restore YandexTracker.slnx
      - run: dotnet build YandexTracker.slnx -c Release --no-restore
      - run: dotnet test YandexTracker.slnx -c Release --no-build --logger trx --results-directory TestResults
      - run: dotnet pack src/YandexTracker/YandexTracker.csproj -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: |
            TestResults/*.trx
            artifacts/*
          if-no-files-found: error
