name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --filter FullyQualifiedName!~YandexTracker.Tests.Integration --logger trx --results-directory artifacts/test-results
      - run: dotnet pack src/YandexTracker/YandexTracker.csproj -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-linux
          path: artifacts/test-results
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: packages-linux
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
